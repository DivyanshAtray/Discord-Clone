<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/kute.js@2.1.2/dist/kute.min.js"></script>
    <title>Developers</title>


    <style>
        * {
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at bottom left, #03031b, #121681);
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.1) 9%, transparent 0%), rgba(255, 255, 255, 0.05);
            background-size: 5px 5px, 100%;
            opacity: 0.4;
            pointer-events: none;
            /* Doesn't block interaction with elements */
        }

        nav {
            width: 100vw;
            height: 35dvh;
            background-color: #313dc383;
            color: aliceblue;
            display: flex;
            flex-direction: column;


        }

        h3,
        h1 {
            position: relative;
            color: #ffffdd;

        }

        h3 {
            font-family: "Open Sans", sans-serif;
            font-size: x-large;
            font-weight: 600;
            transform: translate(15%, 20px);
        }

        h1 {
            font-family: "Open Sans", sans-serif;
            font-size: 7rem;
            font-weight: 800;
            margin-top: 0px;
            transform: translate(16%, -40px);
        }

        .curve {
            position: absolute;
            width: 100%;
            height: 225px;
            bottom: 0;
        }

        .main {
            height: 60dvh;
            width: 100vw;
            display: flex;
            flex-direction: row;
            justify-content: space-around;

            position: relative;
        }
        .blob-content {
        z-index: 1;
        width: 100%;
        height: 60dvh;
        position: absolute;
        display: flex;
        justify-content: space-around;
        transform: translateY(35%);
      }

      .blobs{
        transform: translateY(50px);
      }

        img{
            width: 180px;
            height: 180px;
            border-radius: 100%;
            /* transform: translate(0px, 80px); */
        }
    

        .custom-shape-divider-top-1743167841 {
            position: absolute;
            top: 35dvh;
            left: 0;
            width: 100%;
            overflow: hidden;
            line-height: 0;
        }

        .custom-shape-divider-top-1743167841 svg {
            position: relative;
            display: block;
            width: calc(113% + 1.3px);
            height: 130px;
        }

        .custom-shape-divider-top-1743167841 .shape-fill {
            fill: #313DC383;
        }

        .blob-motion{
            position: absolute;
            /* transform: translateX(-20%); */
            z-index: 0;
        }
        
        @media (max-width: 1155px){
            .main svg{
                width: 980;
                height: 780;
            }
            img{
                width: 160px;
                height: 160px;
            }
        }

        @media (max-width: 800px){
            .blob-content{
                flex-direction: column;
                transform: translate(0%,3%);
                justify-content: space-around;
                align-items: center;
        
            }
            .main{
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            img{
                width: 120px;
                height: 120px;
                transform: translate(0, 60%);
            }
            a{
                width: 200px;
                display: flex;
                justify-content: center;
                align-items:start;
                height: 200px;
            }
            h1{
                transform: translate(5%, -25%);
    
            }
            
        }

        @media (max-width: 700px){
            h1{
                font-size: 5rem;
            }
        }

        @media (max-width: 500px){
            .blobs{
                scale: 0.9;
            }
            h1{
                font-size: 3.25rem;
            }
        }
    
    </style>


</head>

<body>
    <nav>
        <h3>Meet the,</h3> <br>
        <h1>Developers</h1>

        <script>

</html>
